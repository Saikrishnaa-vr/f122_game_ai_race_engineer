[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-ai-race-engineer"
version = "0.1.0"
description = "Read-only F1 22 telemetry and race engineering companion"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]
dashboard = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
voice = ["vosk>=0.3.45,<1", "sounddevice>=0.5,<1", "pyttsx3>=2.90,<3"]
packaging = ["pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["dashboard.html", "practice.html", "replay_library.html", "track_catalog.json", "bahrain_game_route.json", "TRACK_CATALOG_LICENSE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
