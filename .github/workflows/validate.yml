name: Validation

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'feature/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require release PRs from develop
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          if ($env:HEAD_BRANCH -ne 'develop' -or $env:HEAD_REPOSITORY -ne $env:BASE_REPOSITORY) {
            Write-Error 'Release PRs to main must come from this repository''s develop branch.'
            exit 1
          }
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Check dashboard JavaScript syntax
        run: python scripts/check_dashboard_js.py
      - name: Run automated tests
        run: python -m pytest --basetemp .pytest_ci_tmp -q
      - name: Restore saved race fixtures
        run: python scripts/restore_replay_fixtures.py
      - name: Verify recorded Grand Prix replay
        run: python scripts/verify_grand_prix.py
